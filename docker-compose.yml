# MapMax — reference way to build, run, test and EXPOSE the site in containers.
#
#   podman compose up -d edge web     # build + serve via the Caddy edge on
#                                     # 127.0.0.1:14000 (1PESI band: mapmax=4;
#                                     # the port the platform reverse-proxy
#                                     # forwards to — see docker/Caddyfile)
#   WEB_PORT=8081 podman compose up -d edge web   # if the port is taken (dev)
#   podman compose run --rm e2e       # containerized Chromium e2e against web
#   TARGET_URL=https://clement-igonet.github.io/mapmax/ \
#     podman compose run --rm e2e     # same e2e against the deployed site
#
# Public exposure: the owner-managed platform Caddyfile terminates TLS for
# www/sandbox/staging.mapmax.confinia.io and proxies to 127.0.0.1:14000; the
# `edge` service owns that port and routes by hostname (docker/Caddyfile).
# (docker compose works identically.)
services:
  edge:
    image: docker.io/library/caddy:2-alpine
    ports:
      # 1PESI band: mapmax = 14xxx, environment fixed by the E digit —
      # PROD 14000, STAGING 14300 (own listener, same container: the platform
      # allows a listener split for staging). SANDBOX is NOT here: platform
      # RULES §6 requires it to have its own caddy, never one shared with
      # production — see the `edge-sandbox` service below.
      # All three hostnames keep working on 14000 (dual-publish) until the
      # platform edge is flipped to the new ports.
      - "127.0.0.1:${WEB_PORT:-14000}:80"
      - "127.0.0.1:${STAGING_PORT:-14300}:14300"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - web-staging
      # NOT web-sandbox (#146): the sandbox is owned by its own systemd unit,
      # and depends_on would make this unit start it too — production would be
      # back to bouncing the sandbox (and vice versa). The dual-publish route
      # below still reaches it: Caddy resolves the upstream per request.

  # World-band renderer API (#154): headless Chromium running the app's own
  # scene code (see api/server.mjs). SANDBOX-ONLY for now — owned by
  # mapmax-sandbox-stack.service, routed by the sandbox edge; production and
  # Pages have no API and the app falls back to the in-browser spin. No host
  # port. The cache volume survives recreations: bands depend only on
  # (lon, lat, style) and rendering one costs ~a minute of headless Chromium.
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    volumes:
      - worldband-cache:/var/cache/worldband

  # Sandbox edge — its OWN caddy (platform RULES §6): a sandbox must never be
  # proxied through the production edge, so a second port on `edge` would
  # satisfy the numbering and none of the isolation.
  edge-sandbox:
    image: docker.io/library/caddy:2-alpine
    ports:
      - "127.0.0.1:${SANDBOX_PORT:-14400}:80"
    volumes:
      - ./docker/Caddyfile.sandbox:/etc/caddy/Caddyfile:ro
    depends_on:
      - web-sandbox

  web:
    build: .
    # No host port: reachable only through the edge (and the compose network).
    # Production (www + apex); env baked to prod, so experimental flags are off.

  # Staging environment (staging.mapmax.confinia.io): the pre-prod validator.
  # Same base image as web, but MAPMAX_ENV=staging turns on candidate features
  # (e.g. the #95 building radius clip) before they graduate to prod.
  web-staging:
    build:
      context: .
      args:
        MAPMAX_ENV: staging

  # Isolated sandbox environment (sandbox.mapmax.confinia.io): its own container
  # behind the edge's access gate, so experimental/paid-tier builds can diverge
  # from production. Built from docker/Dockerfile.sandbox = the base site PLUS
  # sandbox-only extras (the tools/ dev pages), so www stays pristine.
  web-sandbox:
    build:
      context: .
      dockerfile: docker/Dockerfile.sandbox

  e2e:
    build: tests/browser
    depends_on:
      - web
    environment:
      # pass-through: defaults to http://web/ inside the test script
      - TARGET_URL

volumes:
  worldband-cache:
