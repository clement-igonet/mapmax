# Serve the static MapMax site. Adds the .mjs MIME type so ES module scripts and
# the MapLibre module worker load correctly (nginx's default mime.types lacks it;
# GitHub Pages already serves .mjs as text/javascript).
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
    }
    default_type application/octet-stream;

    # Buildless ESM site with no content-hashed filenames, so a plain browser
    # cache serves stale JS after a deploy (e.g. a retired gate keeps showing).
    # `no-cache` = the browser MUST revalidate via ETag/Last-Modified before
    # reusing a cached copy: unchanged → cheap 304, changed → fresh 200. Deploys
    # therefore apply on the next load without a manual hard-refresh.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
