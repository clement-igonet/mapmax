# Serve the static MapMax site. Adds the .mjs MIME type so ES module scripts and
# the MapLibre module worker load correctly (nginx's default mime.types lacks it;
# GitHub Pages already serves .mjs as text/javascript).
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
    }
    default_type application/octet-stream;

    location / {
        try_files $uri $uri/ =404;
    }
}
