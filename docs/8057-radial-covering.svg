<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>

  <!-- ============ LEFT: today (orientation-dependent frustum) ============ -->
  <text x="30" y="34" font-size="18" font-weight="700" fill="#24292f">Today — covering = view frustum</text>
  <text x="30" y="56" font-size="13" fill="#57606a">zoom keyed on distance to the view CENTER; recomputed as you look</text>

  <!-- ghost frustums (rotated) show it changes with orientation -->
  <g stroke="#d0a5a5" stroke-width="2" fill="none" stroke-dasharray="5 4">
    <path d="M225 380 L60 150 L300 100 Z"/>
    <path d="M225 380 L150 90 L390 175 Z"/>
  </g>
  <!-- active frustum -->
  <path d="M225 380 L95 120 L355 120 Z" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5"/>
  <!-- variable-zoom tiles inside: small near, large far -->
  <g stroke="#3b82f6" fill="none" stroke-width="1.2" opacity="0.75">
    <rect x="205" y="330" width="18" height="18"/><rect x="223" y="330" width="18" height="18"/>
    <rect x="188" y="280" width="30" height="30"/><rect x="218" y="280" width="30" height="30"/>
    <rect x="165" y="215" width="48" height="48"/><rect x="213" y="215" width="48" height="48"/>
    <rect x="140" y="130" width="72" height="72"/><rect x="212" y="130" width="72" height="72"/>
  </g>
  <circle cx="225" cy="380" r="7" fill="#ef4444"/>
  <text x="225" y="404" font-size="12" fill="#57606a" text-anchor="middle">camera</text>
  <!-- rotate arrow -->
  <path d="M300 300 a70 70 0 0 1 -55 -95" fill="none" stroke="#b45f5f" stroke-width="2" marker-end="url(#arw)"/>
  <text x="322" y="270" font-size="13" fill="#b45f5f" font-weight="600">rotate ⟳</text>
  <text x="300" y="290" font-size="12" fill="#b45f5f">→ recompute</text>

  <!-- divider -->
  <line x1="450" y1="20" x2="450" y2="420" stroke="#e1e4e8" stroke-width="1.5"/>

  <!-- ============ RIGHT: proposed (position-only radial disk) ============ -->
  <text x="480" y="34" font-size="18" font-weight="700" fill="#24292f">Proposed — position-only LOD field</text>
  <text x="480" y="56" font-size="13" fill="#57606a">zoom = f(distance to CAMERA), independent of look direction</text>

  <g transform="translate(690,240)">
    <!-- concentric LOD rings: inner = high zoom (fine), outer = low zoom (coarse) -->
    <circle r="150" fill="#eef6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <circle r="100" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
    <circle r="55"  fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
    <!-- radial tile-boundary spokes -->
    <g stroke="#3b82f6" stroke-width="1" opacity="0.45">
      <line x1="0" y1="-150" x2="0" y2="150"/><line x1="-150" y1="0" x2="150" y2="0"/>
      <line x1="-106" y1="-106" x2="106" y2="106"/><line x1="-106" y1="106" x2="106" y2="-106"/>
    </g>
    <!-- current view = one slice of the disk -->
    <path d="M0 0 L52 -140 L-52 -140 Z" fill="#fde68a" opacity="0.55" stroke="#d97706" stroke-width="1.5"/>
    <text x="0" y="-120" font-size="11" fill="#92400e" text-anchor="middle">loaded</text>
    <!-- ring labels -->
    <text x="0" y="30" font-size="11" fill="#1e3a8a" text-anchor="middle">near = high z</text>
    <text x="0" y="128" font-size="11" fill="#1e3a8a" text-anchor="middle">far = low z</text>
    <circle cx="0" cy="0" r="7" fill="#ef4444"/>
  </g>
  <text x="690" y="418" font-size="13" fill="#0a7d33" font-weight="600" text-anchor="middle">a tile's zoom = f(position) ⇒ no re-LOD on look · cache stays valid</text>

  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 z" fill="#b45f5f"/>
    </marker>
  </defs>
</svg>
