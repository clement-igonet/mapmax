<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>MapMax — Panoramax street view in MapLibre</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ff6f00'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.0.0/dist/maplibre-gl.css">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div id="map"></div>
    <div id="hud">
      <div id="hud-title">MapMax</div>
      <div id="hud-status">Loading map…</div>
    </div>
    <button type="button" id="exit-street" title="Back to map (Esc)" hidden>✕ Map</button>
    <div id="blend-control" hidden>
      <label for="blend">Photo ↔ Vector</label>
      <input type="range" id="blend" min="0" max="100" value="100" step="1"
             aria-label="Blend photo and vector layers">
    </div>
    <!-- MapLibre GL JS 6 is ESM-only; resolved (with the plugin's peer) via importmap. -->
    <script type="importmap">
      {"imports": {"maplibre-gl": "https://unpkg.com/maplibre-gl@6.0.0/dist/maplibre-gl.mjs"}}
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
