<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>MapMax — Panoramax street view in MapLibre</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ff6f00'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff'/%3E%3C/svg%3E">
    <!-- Vendored MapLibre GL JS built from main (includes PR #7932: high-pitch
         tile-culling fix, unreleased in 6.0.0). Swap back to the CDN release
         once a build ≥ the fix is published. -->
    <link rel="stylesheet" href="./vendor/maplibre/maplibre-gl.css">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div id="map"></div>
    <div id="hud">
      <div id="hud-title">MapMax</div>
      <div id="hud-status">Loading map…</div>
      <div id="pic-info" hidden></div>
    </div>
    <button type="button" id="exit-street" title="Back to map (Esc)" hidden>✕ Map</button>
    <button type="button" id="flip-pano" title="Photo direction looks reversed? Flip this sequence 180° (#69)" hidden>↺ 180°</button>
    <button type="button" id="pose-toggle" title="Horizon tilted or offset? Level this panorama (pitch / roll / yaw) (#98)" hidden>⌖ Level</button>
    <div id="pose-panel" hidden>
      <button type="button" id="pose-edit" title="Rotate the photo directly: drag = yaw/pitch, ring = roll (#106)">🖐 Adjust by dragging the photo</button>
      <div class="pose-row">
        <label for="pose-pitch">Pitch</label>
        <input type="range" id="pose-pitch" min="-45" max="45" step="0.5" value="0" aria-label="Capture pitch correction (degrees)">
        <span class="pose-val" id="pose-pitch-val">0°</span>
      </div>
      <div class="pose-row">
        <label for="pose-roll">Roll</label>
        <input type="range" id="pose-roll" min="-45" max="45" step="0.5" value="0" aria-label="Capture roll correction (degrees)">
        <span class="pose-val" id="pose-roll-val">0°</span>
      </div>
      <div class="pose-row">
        <label for="pose-yaw">Yaw</label>
        <input type="range" id="pose-yaw" min="-180" max="180" step="1" value="0" aria-label="Image-centre yaw offset from GPS direction (degrees)">
        <span class="pose-val" id="pose-yaw-val">0°</span>
      </div>
      <div class="pose-actions">
        <button type="button" id="pose-reset">Reset</button>
        <button type="button" id="pose-save">Save to Panoramax</button>
      </div>
      <button type="button" id="pose-connect">Connect to Panoramax</button>
      <input type="password" id="pose-token" placeholder="…or paste an API token (kept for this session only)" autocomplete="new-password">
      <div id="pose-status">Adjustments apply live and persist in this browser. With a token they are written back to Panoramax — fixed for everyone.</div>
      <a id="pose-token-help" href="https://panoramax.openstreetmap.fr/api/users/me/tokens" target="_blank" rel="noopener">Get a token from this picture's Panoramax instance ↗</a>
    </div>
    <canvas id="minimap" width="132" height="132" hidden></canvas>
    <!-- Roll ring for the pose edit mode (#106): the dashed circle is visual
         only (pointer-events none, photo drags pass through); the handle dot
         is the grabbable part. -->
    <div id="pose-ring" hidden>
      <div id="pose-ring-handle" title="Turn to roll the photo"></div>
    </div>
    <div id="blend-control" hidden>
      <label for="blend">Photo ↔ Vector</label>
      <input type="range" id="blend" min="0" max="100" value="50" step="1"
             aria-label="Blend photo and vector layers">
    </div>
    <!-- MapLibre GL JS is ESM-only; the vendored build (+ its shared chunk and
         module worker, resolved by relative imports) is mapped here for the app
         and the plugin's maplibre-gl peer. -->
    <script type="importmap">
      {"imports": {"maplibre-gl": "./vendor/maplibre/maplibre-gl.mjs"}}
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
