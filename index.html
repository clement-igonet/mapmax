<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>MapMax — Panoramax street view in MapLibre</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ff6f00'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff'/%3E%3C/svg%3E">
    <!-- Vendored MapLibre GL JS built from main (includes PR #7932: high-pitch
         tile-culling fix, unreleased in 6.0.0). Swap back to the CDN release
         once a build ≥ the fix is published. -->
    <link rel="stylesheet" href="./vendor/maplibre/maplibre-gl.css">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <!-- Reading-first chrome (#111): a persistent header with the brand and a
         SECONDARY utility to fix a panorama's rendering locally. MapMax reads
         open data; it does not edit any server. -->
    <header id="topbar">
      <div id="brand">Map<span>Max</span></div>
      <button type="button" id="edit-main" disabled
              title="Enter a 360° panorama first — Adjust fixes its orientation and position in your browser only">🔧 Adjust</button>
      <div id="topbar-spacer"></div>
    </header>
    <div id="map"></div>
    <div id="hud">
      <div id="hud-status">Loading map…</div>
      <!-- One chip per registered imagery source (#112): colored to match its
           dots, click to show/hide its coverage. -->
      <div id="source-legend" role="group" aria-label="Imagery sources"></div>
      <div id="pic-info" hidden></div>
    </div>
    <button type="button" id="exit-street" title="Leave the panorama and return to the map (Esc)" hidden>← Back to map</button>
    <!-- The edit-mode tool drawer (#111): opens/closes WITH edition mode via
         the header's Edit button. ROTATION cluster (#106): the 180° flip and
         the angle read-out; translation lives beside the ring (#pose-elev). -->
    <div id="pose-panel" hidden>
      <button type="button" id="flip-pano" title="Photo direction looks reversed? Flip this sequence 180° (#69)">↺ Flip 180°</button>
      <div class="pose-row" id="pose-readout">
        <span id="pose-rot-val">Pitch 0° · Roll 0° · Yaw 0°</span>
      </div>
      <div class="pose-actions">
        <button type="button" id="pose-reset">Reset</button>
      </div>
      <div id="pose-status">Corrections apply live and persist in this browser only.</div>
    </div>
    <canvas id="minimap" width="132" height="132" hidden></canvas>
    <!-- Roll ring for the pose edit mode (#106): the dashed circle is visual
         only (pointer-events none, photo drags pass through); the handle dot
         is the grabbable part. -->
    <div id="pose-ring" hidden>
      <div id="pose-ring-handle" title="Turn to roll the photo"></div>
    </div>
    <!-- TRANSLATION cluster (#107), right of the rotation ring: everything
         that MOVES the panorama — compass arrows (lon/lat, 30 cm per click,
         ⇧ = 1 m), the elevation scale (−3 … +6 m) and the Δ read-outs. -->
    <div id="pose-elev" hidden>
      <div id="pose-pad" title="Move the panorama: 30 cm per click, ⇧-click = 1 m">
        <button type="button" class="pad-n" data-e="0" data-n="1">▲</button>
        <button type="button" class="pad-w" data-e="-1" data-n="0">◀</button>
        <button type="button" class="pad-e" data-e="1" data-n="0">▶</button>
        <button type="button" class="pad-s" data-e="0" data-n="-1">▼</button>
      </div>
      <div id="pose-elev-track">
        <div id="pose-elev-handle" title="Drag to adjust the eye height"></div>
      </div>
      <span id="pose-elev-val">0.00 m</span>
      <span id="pose-pos-val">ΔE 0.0 · ΔN 0.0</span>
    </div>
    <div id="blend-control" hidden>
      <label for="blend">Photo ↔ Vector</label>
      <input type="range" id="blend" min="0" max="100" value="50" step="1"
             aria-label="Blend photo and vector layers">
    </div>
    <!-- MapLibre GL JS is ESM-only; the vendored build (+ its shared chunk and
         module worker, resolved by relative imports) is mapped here for the app
         and the plugin's maplibre-gl peer. -->
    <script type="importmap">
      {"imports": {"maplibre-gl": "./vendor/maplibre/maplibre-gl.mjs"}}
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
